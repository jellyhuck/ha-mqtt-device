[project]
name = "ha-mqtt-device"
version = "1.0.0"
description = "Thin library for Home Assistant devices discoverable via MQTT device discovery"
readme = "README.md"
license = "MIT"
authors = [
    { name = "jellyhuck", email = "64114609+jellyhuck@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.3"]

[project.scripts]
ha-mqtt-device = "ha_mqtt_device:main"

[dependency-groups]
dev = [
    "aiomqtt>=2.3",
    "mypy>=1.15",
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "typer>=0.27.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
