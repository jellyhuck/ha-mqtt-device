[project]
name = "ha-mqtt-device"
version = "0.1.0"
description = "Thin library for Home Assistant devices discoverable via MQTT device discovery"
readme = "README.md"
license = "MIT"
authors = [
    { name = "jellyhuck", email = "jellyhuck@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ha-mqtt-device = "ha_mqtt_device:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
